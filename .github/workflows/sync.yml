name: Klaviyo → Notion Sync

on:
  schedule:
    - cron: '0 14 * * 4'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secret
        run: |
          if [ -z "$RECHARGE_API_KEY" ]; then
            echo "RECHARGE_API_KEY is EMPTY or not set"
          else
            echo "RECHARGE_API_KEY is SET, length=${#RECHARGE_API_KEY}"
          fi
        env:
          RECHARGE_API_KEY: ${{ secrets.RECHARGE_API_KEY }}

      - name: Run sync
        env:
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID:      ${{ secrets.NOTION_PAGE_ID }}
          KLAVIYO_LIST_ID:     ${{ secrets.KLAVIYO_LIST_ID }}
          KLAVIYO_SEGMENT_ID:  ${{ secrets.KLAVIYO_SEGMENT_ID }}
          RECHARGE_API_KEY:    ${{ secrets.RECHARGE_API_KEY }}
        run: node sync.js
