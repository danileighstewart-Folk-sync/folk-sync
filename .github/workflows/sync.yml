name: Klaviyo → Notion Sync

on:
  schedule:
    - cron: '0 14 * * 4'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run sync
        env:
          KLAVIYO_PRIVATE_KEY: ${{ secrets.KLAVIYO_PRIVATE_KEY }}
          NOTION_TOKEN:        ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID:      ${{ secrets.NOTION_PAGE_ID }}
          KLAVIYO_LIST_ID:     ${{ secrets.KLAVIYO_LIST_ID }}
          KLAVIYO_SEGMENT_ID:  ${{ secrets.KLAVIYO_SEGMENT_ID }}
        run: node sync.js
